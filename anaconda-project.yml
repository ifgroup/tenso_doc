name: TENSO
description: Tree tensor network hierarchical equantions of motion based on time-dependent variational principle for efficient open quantum dynamics in structured thermal environments

commands:
  quickstart:
    unix: sphinx-quickstart
  build:
    unix: rm -rf build & sphinx-build -b html ./source ./build
  serve:
    unix: python -m http.server --directory ./build

env_specs:
  default:
    packages:
      - python=3
      - sphinx=7.3.7
      - myst-parser
      - sphinx-book-theme
      - sphinx-math-dollar
      - nbsphinx
      - myst-nb
      - pygments
      - sphinx-autoapi
      - sphinx-rtd-theme

channels:
  - defaults
  - https://conda.anaconda.org/conda-forge/
