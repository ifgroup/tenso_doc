name: TENSO_Docs
description: Documentation for the TENSO project

channels:
  - conda-forge
  - defaults

packages:
  - python=3.11
  - sphinx=8.1.3
  - sphinx-autoapi
  - sphinx-rtd-theme
  - myst-nb
  - sphinx-math-dollar
  - sphinx-design

commands:
  build:
    unix: rm -rf build && sphinx-build -M html source build
  rebuild:
    unix: rm -rf build source/autoapi && sphinx-build -M html source build
  serve:
    unix: python -m http.server --directory build/html
